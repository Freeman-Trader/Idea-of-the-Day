<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A fresh idea for every day.">
	<title>Idea of the Day</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #17221f;
			--muted: #68736d;
			--paper: #f5f0e6;
			--card: #fffdf8;
			--accent: #d96c4f;
			--accent-dark: #a84432;
			--line: #e5dbcb;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background:
				radial-gradient(circle at 12% 18%, rgba(217, 108, 79, 0.15), transparent 28%),
				radial-gradient(circle at 88% 80%, rgba(66, 117, 98, 0.16), transparent 30%),
				var(--paper);
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			width: min(100%, 760px);
			padding: clamp(32px, 8vw, 76px);
			border: 1px solid var(--line);
			background: rgba(255, 253, 248, 0.88);
			box-shadow: 0 24px 70px rgba(77, 59, 39, 0.12);
		}

		.eyebrow {
			margin: 0 0 22px;
			color: var(--accent-dark);
			font: 700 0.76rem/1.2 Arial, sans-serif;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 600px;
			margin: 0;
			font-size: clamp(2.8rem, 8vw, 5.8rem);
			font-weight: 400;
			line-height: 0.95;
			letter-spacing: -0.04em;
		}

		.date {
			margin: 28px 0 0;
			color: var(--muted);
			font: 0.92rem/1.5 Arial, sans-serif;
		}

		.rule {
			width: 72px;
			height: 4px;
			margin: 46px 0 28px;
			background: var(--accent);
		}

		.idea {
			margin: 0;
			max-width: 610px;
			font-size: clamp(1.65rem, 4vw, 2.65rem);
			line-height: 1.18;
		}

		.note {
			margin: 30px 0 0;
			color: var(--muted);
			font: 0.82rem/1.5 Arial, sans-serif;
		}

		@media (max-width: 480px) {
			body { padding: 12px; }
			main { padding: 32px 24px 38px; }
			.rule { margin-top: 36px; }
		}
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Idea of the Day</p>
		<h1 id="date-heading">Today</h1>
		<p class="date" id="date-label"></p>
		<div class="rule" aria-hidden="true"></div>
		<p class="idea" id="idea" aria-live="polite"></p>
		<p class="note">A new idea arrives with each new day.</p>
	</main>

	<script>
		const ideas = [
			"A neighborhood library for tools, where people borrow drills, cameras, and camping gear instead of buying them.",
			"A quiet morning app that turns the first ten minutes of your day into one small, achievable experiment.",
			"A community fridge that shares not only food, but the recipes and stories behind every donated ingredient.",
			"A service that pairs unfinished hobbies with local mentors who can help you complete the very first step.",
			"A walking map that replaces landmarks with questions, inviting you to notice something new on a familiar route.",
			"A subscription that sends one beautifully made object each month, along with the name of the person who made it.",
			"A shared calendar for neighbors to trade small favors, from watering plants to carrying groceries upstairs."
		];
		const generatedDate = null;
		const generatedIdea = null;

		const today = new Date();
		const dayNumber = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 86400000);
		const idea = generatedIdea || ideas[((dayNumber % ideas.length) + ideas.length) % ideas.length];
		const displayDate = generatedDate ? new Date(`${generatedDate}T00:00:00`) : today;
		const formattedDate = new Intl.DateTimeFormat(undefined, {
			weekday: "long",
			month: "long",
			day: "numeric",
			year: "numeric"
		}).format(displayDate);

		document.title = `Idea of the Day | ${formattedDate}`;
		document.getElementById("date-heading").textContent = new Intl.DateTimeFormat(undefined, {
			month: "long",
			day: "numeric"
		}).format(displayDate);
		document.getElementById("date-label").textContent = formattedDate;
		document.getElementById("idea").textContent = idea;
	</script>
</body>
</html>
